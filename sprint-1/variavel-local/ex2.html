<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="input_numb1"> Insira o primeiro numero <br>
    <input type="text" id="input_numb2"> Insira o segundo numero <br>
    <button onclick="quociente()">Quociente</button> <br>
    <button onclick="resto()">Resto</button> <br>
    <button onclick="completo()">Completo</button> <br>
    <div id="exibir_mensagem"></div>
</body>
</html>

<script>


function quociente (){
    let numb1 = Number (input_numb1.value);
    let numb2 = Number (input_numb2.value);  
    let divisao = numb1 / numb2;
    let mensagem = `A divisão de ${numb1} por ${numb2} é: ${divisao}` 

exibir_mensagem.innerHTML = mensagem 
};

function resto() {
  let numb1 = Number(input_numb1.value);
  let numb2 = Number(input_numb2.value);
  let calcularResto = numb1 % numb2;
  let mensagem = `O resto da divisão ${numb1} por ${numb2} é: ${calcularResto}`;

  exibir_mensagem.innerHTML = mensagem;
};
    
function completo () {
  let numb1 = Number(input_numb1.value);
  let numb2 = Number(input_numb2.value);
  let calcularResto = numb1 % numb2;
  let divisao = numb1 / numb2;

  let mensagem = `A divisão de ${numb1} por ${numb2} é: ${divisao} e o resto dessa divisão é: ${calcularResto}`;

  exibir_mensagem.innerHTML = mensagem;
};
    
    

</script>
