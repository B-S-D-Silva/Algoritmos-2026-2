<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="ipt_saldo"> saldo<br>
    <input type="text" id="ipt_debito"> debito <br>
    <button onclick="calcular()">Analisar Conta</button> <br>
    <div id="exibir_msg"></div>
</body>
</html>
<script>

    function calcular (){
        let saldo = Number (ipt_saldo.value);
        let debito = Number (ipt_debito.value);
        let saldoAtual = saldo - debito
        let mensagem = `O saldo atual da conta corrente é ${saldoAtual}`
        exibir_msg.innerHTML = mensagem

        if (saldoAtual < 0)
        exibir_msg.innerHTML = `<br><span style="color: red;">O saldo atual da conta corrente é ${saldoAtual}</span></b>`

    };
</script>
