<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="input_nota1"> valor da pizza <br>
    <input type="text" id="input_nota2"> quantidade de amigos<br>
    <button onclick="analisar()"> Rola a pizza? </button>
    <div id="exibir_msg"></div>
    
    
</body>
</html>

<script>


    function analisar (){

    let nota1 = Number (input_nota1.value);
    let nota2 = Number (input_nota2.value);
    let media = (nota1 / nota2).toFixed(2);
    let mensagem1 = `Cada amigo vai pagar R$${media} pela pizza `
    let mensagem2 = `<span style="color: red;"><b><i>Deu ruim! Pizza muito cara!</i></b></span> `

    exibir_msg.innerHTML = mensagem1

    if(media >= 20){
    exibir_msg.innerHTML += mensagem2
    };
   
    };
</script>
