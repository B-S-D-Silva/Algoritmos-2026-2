<!DOCTYPE html>
<html lang="en">
<head>

</span>
<body>
    <input type="text" id="ipt_time">Qual dos seguintes times de São Paulo torce (São Paulo, Palmeiras, Corinthians, Santos);  <br>
    <button onclick="verificar()">Fale sobre esse time</button>
    <div id="exibir_msg"></div>
</body>


</html>

<script>
function verificar (){
let time = ipt_time.value

if (time == 'Corinthians'){
exibir_msg.innerHTML = '<span style="background-color: black;color: white;">Salve o Corinthians</span>'

} else if (time == 'Palmeiras')
exibir_msg.innerHTML = '<span style="background-color: green;color: white;"> Salve o alviverde imponente</span'

else if (time == 'Santos' ) {
exibir_msg.innerHTML = '<span style="background-color: white;color: black;">Agora quem dá a bola é o Santos</span>'

}else if (time == 'São Paulo')
exibir_msg.innerHTML = '<span style="background-color: black;color: red;">Salve o Tricolor paulista</span>'

};
</script>
