<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<body>
    <div id="exibir_mensagem"></div>

<button onclick="processar ()">incrementar</button>
<div id="div_exibir"></div>
<script>
    
 let contador = 0

 function processar () {

 contador += 1
 
 let mensagem = `${contador}<br><br>`

 div_exibir.innerHTML += mensagem



};
</script>
