<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
</head>
<body>
    <input type="text" id="ipt_login"> login <br>
    <input type="text" id="ipt_senha"> senha <br>
     <input type="text" id="ipt_codigo"> codigo segurança <br>

    <button onclick="verificar()">entrar</button>
    
</body>

<script>

function verificar(){
    let login = ipt_login.value;
    let senha = ipt_senha.value;
    let codigo = Number (ipt_codigo.value);

    if (login == 'Sptech' && senha == 'digital' && codigo == 123){
        alert('Usuário autenticado com sucesso');
    } else {
        alert('Falha na autenticação'); 
    }
}
</script>
