<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

Distância inicial semanal do aluno (em km).
<input type="text" id="ipt_distancia_inicial"> <br>
O percentual de aumento semanal desejado (de 0 a 100).
<input type="text" id="ipt_percentual_semanal"> <br>
A meta de distância semanal (em km).
<input type="text" id="ipt_meta_distancia"> <br>
O número máximo de semanas do plano.
<input type="text" id="ipt_semanas_max">

<button onclick="calcular()">Gerar planilha </button>

<div id="exibir_msg"></div>
    
</body>
</html>

<script>
    function calcular (){

        let distancia_inicial = Number (ipt_distancia_inicial.value)
        let percentual_semanal = Number (ipt_percentual_semanal.value)
        let meta_distancia = Number (ipt_meta_distancia.value)
        let semanas_max = Number (ipt_semanas_max.value)

        let contador = 0
        let somaSemanal = 0
        let distanciaContador = distancia_inicial

    // A distância inicial for menor ou igual a 0;
    // O percentual de aumento for menor que 1 ou maior que 10 (regra dos 10%);
    // A meta for menor ou igual à distância inicial;
    // O número de semanas for menor que 1 ou maior que 24.

    if (distancia_inicial <= 0){
        alert ('distancia invalida')

    } else if (percentual_semanal < 1 && percentual_semanal > 10){
        alert ('percentual invalido')

    } else if (meta_distancia <= distancia_inicial){
        alert ('meta invalida')

    } else if (semanas_max < 1 || semanas_max > 24){
        alert ('semanas invalida')

    } else {

    // Utilizando a estrutura de repetição while, gere a planilha semana a semana, exibindo:

    // "SEMANA N - X km (Y% da meta)"


        while (contador < semanas_max || somaSemanal >= meta_distancia){

            contador++

            if (contador % 4 == 0){
                exibir_msg.innerHTML += `SEMANA ${contador} - ${distanciaContador}km (${(distanciaContador / meta_distancia * 100).toFixed(2)}% da meta) <br>`

            }
        else {
             exibir_msg.innerHTML +=`SEMANA ${contador} - ${distanciaContador}km (${(distanciaContador / meta_distancia * 100).toFixed(2)}% da meta)<br>`
             distanciaContador += distancia_inicial * (percentual_semanal / 100)
        }
        
     }

     exibir_msg.innerHTML +=`Meta de ${meta_distancia} km atingida na semana ${contador}! Total acumulado no plano: ${somaSemanal} km.`






    }






    }



</script>
