<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>


    <input type="text" id="ipt_quantidade"> Quantidade dará em uma corrida
    <div id="exibir_mensagem"></div>
  </body>
</html>
<button onclick="processar()">Iniciar corrida!...</button>
<div id="div_exibir"></div>
<script>

  

function processar() {
 
    let qtd = Number(ipt_quantidade.value);
    let contador = 0;

    
    div_exibir.innerHTML = ""; 

        while (contador < qtd) {
            div_exibir.innerHTML += `Carro dando a ${contador+1}ª volta<br><br>`;
            contador += 1;
        }
        if (contador == qtd){
            div_exibir.innerHTML += `Corrida finalizada!`
        }
    }
    
</script>
