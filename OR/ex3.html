<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <input type="text" id="ipt_renda"> qual sua renda
    <input type="text" id="ipt_renda_familia"> qual a renda da sua familia no total
    <button onclick="verificar()">Terei o benefício</button>
    <div id="exibir_msg"></div>
</body>

<script>

 function verificar (){
 let renda = Number (ipt_renda.value)
 let rendaFamilia = Number (ipt_renda_familia.value)

 if (renda <=2000 || rendaFamilia <=3000){
    alert ('Você terá direito ao auxílio')
 } else {
    alert ('Sem direito ao auxílio')
 }
}
</script>
