<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="exibir_mensagem"></div>
  </body>
</html>
<button onclick="processar()">incrementar</button>
<div id="div_exibir"></div>
<script>

function processar (){  

let contador = 0;


while (contador <= 30) {
    if (contador != 3 && contador != 4 && contador != 7 && contador != 10 && contador != 12) {
        div_exibir.innerHTML += `${contador} <br>`
    }
    contador++
} 
}

</script>
