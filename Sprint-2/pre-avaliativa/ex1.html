<script>

       let litroGasolina = 6.49;
       let litroEtanol =  4.44;
       let litroDiesel =  4.39;

       let precoCombustivel = 0
       let desconto = 0
       let valorVenda = 0
       let contador = 0
       let valorDescontoConcedido = 0
    
    function venda (){

       let horaCompra = Number (document.getElementById("hora_id").value);
       let tipoCombustivel = document.getElementById("combustivel_id").value;
       let qtdLitros = Number (ipt_qtdLitros.value)
       valorDescontoConcedido = valorVenda * desconto;




       console.log(tipoCombustivel, horaCompra)

       if (tipoCombustivel == 'etanol') {
       precoCombustivel = precoCombustivel * litroEtanol
       desconto = 0.0303
       contador ++

       }else if (tipoCombustivel = 'diesel') {
       precoCombustivel = precoCombustivel * litroDiesel
       desconto = 0.048
       contador ++

       }else if (tipoCombustivel == 'gasolina')
       precoCombustivel = precoCombustivel * litroGasolina
       desconto = 0.0505
       contador ++


       if (qtdLitros >= 20 && horaCompra >= 21 && horaCompra <=6)

       valorVenda = (qtdLitros * precoCombustivel)
       valorDescontoConcedido = valorVenda * desconto;
       valorVenda = valorVenda - valorDescontoConcedido
      
       exibir_msg.innerHTML = `Venda ${contador} – Valor Recebido = R$ ${valorVenda} – Desconto Concedido = R$ ${desconto} – Acumulado dos Recebimentos= R$ cccc,cc - Acumulado dos Descontos = R$ cccc,cc`



    }

</script>
