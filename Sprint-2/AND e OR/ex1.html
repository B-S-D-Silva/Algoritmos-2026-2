<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="text" id="ipt_nota" /> Qual a nota para o atendimento? (0 a 10)
    <button onclick="avaliar()">Avaliar atendimento</button>
    <div id="exibir_msg"></div>
  </body>
</html>

<script>

  function avaliar() {

    let nota = parseFloat(ipt_nota.value);

    if (nota < 0 || nota > 10 || nota !== nota) {
      exibir_msg.innerHTML = "Nota inválida";

    } else if (nota >= 0 && nota < 5) {
      exibir_msg.innerHTML = "Não aprovado";

    } else if (nota >= 5 && nota <= 6) {
      exibir_msg.innerHTML = "Neutro";

    } else if (nota > 6) {
      exibir_msg.innerHTML = "Aprovado";
    }

  }
</script>
