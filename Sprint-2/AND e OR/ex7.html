<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="text" id="ipt_login" /> Login
    <br />
    <input type="password" id="ipt_senha" /> Senha
    <br />
    <input type="text" id="ipt_info" /> Ano de nascimento ou nome do animal de estimação
    <br />
    <button onclick="autenticar()">Autenticar</button>
    <div id="exibir_msg"></div>
  </body>
</html>

<script>

  let tentativas = 3;

  function autenticar() {

    if (tentativas > 0) {

      let login = ipt_login.value;
      let senha = ipt_senha.value;
      let info = ipt_info.value;

      if (login == "ana" && senha == "braga" && (info == "1949" || info == "louro josé")) {
        exibir_msg.innerHTML = "Usuário autenticado";
        tentativas = 3;

      } else {
        tentativas = tentativas - 1;

        if (tentativas <= 0) {
          exibir_msg.innerHTML = "Falha na autenticação<br>Usuário BLOQUEADO! Procure seu gerente!";

        } else {
          exibir_msg.innerHTML = "Falha na autenticação<br>Você ainda tem " + tentativas + " tentativa(s)";
        }
      }

    }

  }
</script>
