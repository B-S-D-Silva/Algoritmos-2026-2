<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
	<input type="text" id="ipt_filme" placeholder="Nome do filme">
	<button onclick="cadastrar()">Cadastrar</button>

	<div id="div_exibir"></div>

	<script>
		var quantidadeFilmes = 0

		function cadastrar() {
			if (ipt_filme.value != '') {
				let cor = 'blue'

				if (quantidadeFilmes % 2 != 0) {
					cor = 'red'
				}

				div_exibir.innerHTML += `<p style="color: ${cor};">${ipt_filme.value}</p>`
				quantidadeFilmes++
				ipt_filme.value = ''
			}
		}
	</script>
</body>
</html>
