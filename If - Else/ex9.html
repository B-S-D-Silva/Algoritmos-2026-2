<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="ipt_homem">  Quantidade de homens no elevador <br>
    <input type="text" id="ipt_mulher"> Quantidade de mulheres no evelador <br>
    <button onclick="analisar ()">Analisar peso</button>
    <div id="div_exibir"></div>

    
</body>
</html>

<script>

    function analisar () {
        let qtdHomens = Number (ipt_homem.value)
        let qtdMulher = Number (ipt_mulher.value)
        let pesoHomen = qtdHomens * 80
        let pesoMulher = qtdMulher * 60
        let somaPeso = pesoHomen + pesoMulher
        let mensagem = `Este elevador suporta 800 Kg e o peso estimado desta lotação é de ${somaPeso} Kg `
        div_exibir.innerHTML = mensagem

        if (somaPeso > 800)
        div_exibir.innerHTML += `<span style="color: blue;">Será necessário que alguém desça para que o elevador se movimente </span>`
    };
</script>
