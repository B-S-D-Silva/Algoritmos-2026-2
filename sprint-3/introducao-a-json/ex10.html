<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

  Marca do celular<input type="text" id="ipt_marca"><br>
   modelo <input type="text" id="ipt_modelo"><br>
   preco <input type="text" id="ipt_preco"><br>

    <button onclick="cadastrar()">Cadastrar celular</button>

    <div id="exibir"></div>
</body>

</html>

<script>

    let valorTotal = 0

    function cadastrar (){ 

        
        
        let celular = {

            marca: ipt_marca.value,
            modelo: ipt_modelo.value,
            preco: Number(ipt_preco.value)

        }
        celular.precoDesconto = (celular.preco) - celular.preco * 0.15

        exibir.innerHTML += `

            Marca: ${celular.marca} <br>
            Modelo: ${celular.modelo}<br>
            Preço Original: ${celular.preco}<br>
            Preço com Desconto: ${celular.precoDesconto} <br>

        `
        console.log(celular)

    }

</script>
