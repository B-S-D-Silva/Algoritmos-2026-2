<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Quantas pessoas? <input type="text" id="ipt_pessoas">
    <button onclick="processar()">#Partiu Carona</button>
    <div id="exibir"></div>
    
</body>
</html>

<script>

    function processar (){

        let pessoas = ipt_pessoas.value;

        for (let i = 1; i<=pessoas;i++){

            if (i == 1){
                exibir.innerHTML += `Entrou o ${i}º passageiro (que é o(a) motorista) <br>`

            }

            else if (i >=6 && i >= 1){
                exibir.innerHTML += `O ${i}º passageiro terá que esperar! <br>`

            } else {
                exibir.innerHTML += `Entrou o ${i}º passageiro <br>`

            }

        }

    }

</script>
