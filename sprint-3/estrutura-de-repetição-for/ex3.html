    1 a 10<input type="text" id="ipt_num1"> <br>

    <div id="exibir"></div>

<script>
    function processar () {

        let num1 = Number (ipt_num1.value);
        let num2 = Number (ipt_num2.value);
        let mensagem = (exibir.innerHTML = "");


        if (num1 > 0 && num1 <= 10 && num2 >=30 && num2 <=100){


          for (let i = num1; i <= num2; i++ ){
            if (i % 2 == 0) {
                exibir.innerHTML += `${i} <br>`

            }
            
          }

        } else {
            exibir.innerHTML += `digite um intervalo válido`
        }
        

    }
</script>
