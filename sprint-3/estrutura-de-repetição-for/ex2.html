<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    Quantas pessoas? <input type="text" id="ipt_pessoas" /> Capacidade do Carro
    <input type="text" id="ipt_carro" />
    <button onclick="processar()">#Partiu Carona</button>
    <div id="exibir"></div>
  </body>
</html>

<script>
  function processar() {
    let carro = Number(ipt_carro.value);

    let pessoas = Number(ipt_pessoas.value);

    let mensagem = (exibir.innerHTML = "");

    for (let i = 1; i <= pessoas; i++) {
      console.log(i);

      if (i == 1) {
        exibir.innerHTML += `Entrou o ${i}º passageiro (que é o(a) motorista) <br>`;
      } else if (i > carro && i >= 1) {
        exibir.innerHTML += `O ${i}º passageiro terá que esperar! <br>`;
      } else {
        exibir.innerHTML += `Entrou o ${i}º passageiro <br>`;
      }
    }
  }
</script>
