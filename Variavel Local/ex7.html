<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="input_sabor"> Sabor da Pizza<br>
    <input type="text" id="input_valor"> Valor da Pizza<br>
    <input type="text" id="quantidade_amigos"> Quantidade de Amigos <br>
    <button onclick="valorDividido()">Ver valor por amigo</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
 function valorDividido (){
    
 let saborPizza = input_sabor.value;
 let valorPizza = Number (input_valor.value);
 let porcentagemEntrega = valorPizza * 0.10;
 let quantidadeAmigos = Number (quantidade_amigos.value);
 let calculoDivisao = Number (valorPizza / quantidadeAmigos);
 let valorFinal = calculoDivisao + porcentagemEntrega
 let mensagem = ` Cada amigo vai colaborar com R$${valorFinal} para a pizza de ${saborPizza}.  `;


 div_exibir.innerHTML = mensagem;


 };

</script>
