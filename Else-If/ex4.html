<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="ipt_peso">Insira o peso
    <button onclick="verificar()">Analisar</button>
    <div id="exibir"></div>
</body>
</html>

<script>
function verificar (){
let peso = Number (ipt_peso.value)

if (peso <= 13.5){
exibir.innerHTML = 'Abaixo do peso'

} else if (peso == 18.3)
exibir.innerHTML = 'Peso perfeito'

else if (peso <= 21.2) {
exibir.innerHTML = 'Peso na média'

}else if (peso > 21.2){
exibir.innerHTML = 'Acima do peso'

}
};
</script>
