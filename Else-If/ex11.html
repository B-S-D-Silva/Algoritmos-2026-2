<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="ipt_umidade"> umidade atual do ambiente.<br>
    
    <button onclick="verificar()">Verificar umidade</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>

function verificar () {

let umidade = Number (ipt_umidade.value) 

    if (umidade < 0) {
        alert("Por favor, insira um valor válido entre 0 e 100.");
    } else if (umidade > 100) {
        alert("Por favor, insira um valor válido entre 0 e 100.");

    } else if (umidade < 12) {
        div_exibir.innerHTML = `Estado de Emergência`;
    } else if (umidade <= 20) {
        div_exibir.innerHTML = `Estado de alerta`;
    } else if (umidade <= 30) {
        div_exibir.innerHTML = `Estado de atenção`;
    } else {
        div_exibir.innerHTML = `Nenhum risco`;
    }
}
</script>
