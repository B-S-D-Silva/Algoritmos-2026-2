<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="ipt_renda">
    <button onclick="analisar()">Analisar Renda</button>
    <div id="exibir_msg"></div>
</body>
</html>

<script>
function analisar (){
    let renda = Number (ipt_renda.value)

    if (renda <=250){
    exibir_msg.innerHTML = 'Classe E'
    }
    else if (renda <= 900){
        exibir_msg.innerHTML = 'Classe D'

    }else if (renda <= 2500){
    exibir_msg.innerHTML = 'Classe C'

    }else if (renda <= 9500){
    exibir_msg.innerHTML = "Classe B"
    
    }else 
    exibir_msg.innerHTML = 'Classe A'
    };
</script>
